			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Every language is a download (Apple-hosted pack, then the GitHub mirror),\n# so the app stays small. BUNDLED_LANGUAGES lists ids to carry inside the app\n# instead (Languages/<id>, ~120-190 MB each); it is empty by the founder's\n# decision of 2026-10-07. Debug builds also carry every unpacked pack as\n# DevPacks, so a phone can install one before the packs are on App Store\n# Connect; Release builds never include DevPacks.\npacks=\"$SRCROOT/../../.work/ios-packs\"\nresources=\"$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH\"\nrm -rf \"$resources/Languages\"\nfor language in ${BUNDLED_LANGUAGES:-}; do\n  if [ ! -d \"$packs/$language\" ]; then\n    echo \"error: language pack $language is not staged in $packs (run scripts/stage-ios-resources.sh)\"\n    exit 1\n  fi\n  mkdir -p \"$resources/Languages/$language\"\n  rsync -a --delete \"$packs/$language/\" \"$resources/Languages/$language/\"\ndone\nif [ \"$CONFIGURATION\" = \"Debug\" ] && [ -d \"$packs\" ]; then\n  mkdir -p \"$resources/DevPacks\"\n  rsync -a --delete \"$packs/\" \"$resources/DevPacks/\"\nelse\n  rm -rf \"$resources/DevPacks\"\nfi\n";
		};
